name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile the Python sources
        run: python -m compileall -q code
      - name: Check the README figure links
        run: |
          python - <<'PY'
          import pathlib
          import re

          readme = pathlib.Path("README.md").read_text()
          targets = re.findall(r"!\[[^\]]*\]\(([^)\s]+)\)", readme)
          missing = [t for t in targets if not pathlib.Path(t).exists()]
          assert not missing, f"missing figure files: {missing}"
          print(f"{len(targets)} figure links resolve")
          PY
